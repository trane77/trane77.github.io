name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CV PDF from cv/cv.typ
        run: |
          curl -sSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar xJ
          mkdir -p cv/fonts
          curl -sSL -o 'cv/fonts/SourceSans3[wght].ttf' 'https://github.com/google/fonts/raw/main/ofl/sourcesans3/SourceSans3%5Bwght%5D.ttf'
          ./typst-x86_64-unknown-linux-musl/typst compile --font-path cv/fonts cv/cv.typ public/Federico_Ricchiuto_Resume.pdf
      - uses: withastro/action@v3
        with:
          node-version: 24 # Astro 7 needs Node >= 22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
